<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精神病院 · 内部档案系统</title>

<!-- ===== SECURITY META ===== -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
<meta http-equiv="X-Permitted-Cross-Domain-Policies" content="none">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()">

<!-- ===== CSS ===== -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/new-pages.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<!-- ===== UNIFIED INTRO (splash ~3s + loading ~2.5s) ===== -->
<div id="intro-overlay">
  <div class="intro-phase intro-splash active" id="introSplash">
    <svg class="intro-icon-svg" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="intro-ring" cx="60" cy="60" r="54"/>
      <path class="intro-arc-t" d="M18 60 A42 42 0 0 1 102 60"/>
      <path class="intro-arc-b" d="M18 60 A42 42 0 0 0 102 60"/>
      <circle class="intro-core" cx="60" cy="60" r="14"/>
    </svg>
    <h1 class="intro-title">精神病院</h1>
    <p class="intro-sub">Internal Records</p>
  </div>
  <div class="intro-phase intro-loading" id="introLoading">
    <div class="intro-card">
      <svg class="intro-card-icon" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="54" fill="none" stroke="var(--brand)" stroke-width="3" opacity="0.35"/>
        <circle cx="60" cy="60" r="28" fill="none" stroke="var(--gold-2)" stroke-width="2.5" opacity="0.5"/>
        <circle cx="60" cy="60" r="14" fill="var(--bg-deep)" stroke="var(--gold-2)" stroke-width="2"/>
      </svg>
      <div class="intro-card-text">档案系统加载中</div>
      <div class="intro-card-bar"><div class="intro-card-fill" id="introBarFill"></div></div>
      <div class="intro-card-status" id="introStatus">正在解密档案...</div>
    </div>
  </div>
</div>

<!-- ===== FLOATING CONTROLS (replaces top bar) ===== -->
<div class="floating-controls">
  <!-- Left: Hamburger + Brand -->
  <div class="floating-left">
    <button class="floating-btn hamburger" id="hamburgerBtn" aria-label="打开菜单">
      <span></span><span></span><span></span>
    </button>
    <button class="floating-btn brand-fab" data-link="home" aria-label="返回主页" title="精神病院档案">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="si-ring" cx="60" cy="60" r="54" />
        <path class="si-geo si-arc-top" d="M18 60 A42 42 0 0 1 102 60" />
        <path class="si-geo si-arc-bottom" d="M18 60 A42 42 0 0 0 102 60" />
        <circle class="si-geo si-photon" cx="60" cy="60" r="28" />
        <circle class="si-geo si-horizon" cx="60" cy="60" r="14" />
        <line class="si-geo si-jet-top" x1="60" y1="4" x2="60" y2="22" />
        <line class="si-geo si-jet-bottom" x1="60" y1="98" x2="60" y2="116" />
        <circle class="si-geo si-frag si-frag-1" cx="30" cy="30" r="3" />
        <circle class="si-geo si-frag si-frag-2" cx="90" cy="90" r="2.5" />
        <circle class="si-geo si-frag si-frag-3" cx="92" cy="28" r="2" />
      </svg>
    </button>
  </div>

  <!-- Right: Search + Theme Toggle -->
  <div class="floating-right">
    <div class="floating-search" id="floatingSearch">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="globalSearch" placeholder="搜索档案..." autocomplete="off" maxlength="80" aria-label="全局搜索">
      <button class="search-clear" id="searchClear" aria-label="清空">×</button>
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>
    <div class="nav-actions" id="navActions">
      <!-- theme toggle button injected by theme.js -->
    </div>
  </div>
</div>

<!-- ===== SIDEBAR OVERLAY ===== -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ===== SIDEBAR (right side) ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">导航菜单</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="关闭菜单">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <ul class="sidebar-links" id="navLinks">
    <li><a data-link="home"><span class="sb-icon">⌂</span> 主页</a></li>
    <li><a data-link="characters"><span class="sb-icon">人</span> 人设</a></li>
    <li><a data-link="rules"><span class="sb-icon">§</span> 守则</a></li>
    <li><a data-link="departments"><span class="sb-icon">▣</span> 部门</a></li>
    <li><a data-link="stories"><span class="sb-icon">¶</span> 故事</a></li>
    <li><a data-link="contaminants"><span class="sb-icon">☣</span> 污染物</a></li>
    <li><a data-link="map"><span class="sb-icon">▤</span> 地图</a></li>
    <li><a data-link="stats"><span class="sb-icon">▤</span> 统计</a></li>
    <li><a data-link="relations"><span class="sb-icon">⬡</span> 关系图</a></li>
  </ul>

  <div class="sidebar-divider"></div>

  <div class="sidebar-footer-info">
    <span>系统版本 2.4.0</span>
    <span class="footer-divider">|</span>
    <span>只读档案模式</span>
  </div>
</aside>


<div class="vignette"></div>
<canvas id="fx-canvas"></canvas>
<div id="cursor-glow"></div>
<div id="scroll-progress"></div>

<div class="main" id="app"></div>

<footer class="footer">
  <div class="badge" id="footerBadge" title="双击进入关于页面">精神病院 · 内部档案系统</div>
  <div class="footer-status">
    <span class="staff-badge" title="当前在职人员">
      <span class="dot"></span>
      <span class="full">在职人员 87</span>
      <span class="short">87</span>
    </span>
    <span class="footer-divider">|</span>
    <span>Psychiatric Hospital — Internal Records System</span>
  </div>
  <p>未经授权访问者将依法追究责任 &nbsp;|&nbsp; 系统版本 2.4.0</p>
</footer>

<!-- ===== DATA FILES ===== -->
<script src="data/departments.js"></script>
<script src="data/characters.js"></script>
<script src="data/rulebooks.js"></script>
<script src="data/contaminants.js"></script>
<script src="data/stories.js"></script>
<script src="data/svg-icons.js"></script>

<!-- ===== JS MODULES ===== -->
<!-- Security module MUST load first to freeze prototypes and provide SecurityGuard -->
<script src="js/security.js"></script>
<script src="data/categories.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
<script src="js/effects.js"></script>
<script src="js/theme.js"></script>
<script src="js/filter.js"></script>
<script src="js/relation-graph.js"></script>
<script src="js/shortcuts.js"></script>

</body>
</html>
